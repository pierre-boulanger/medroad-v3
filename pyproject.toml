[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "medroad-v3"
version         = "2.0.0"
description     = "Real-time multi-modal FHIR sensor fusion for clinical decision support"
readme          = "README.md"
requires-python = ">=3.11"
license         = { file = "LICENSE" }
authors         = [{ name = "Pierre Boulanger", email = "pierreb@ualberta.ca" }]
keywords = [
    "FHIR", "sensor fusion", "telemedicine", "clinical decision support",
    "remote patient monitoring", "stream processing", "explainable AI",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
ml     = ["xgboost>=2.0.0", "shap>=0.44.0", "torch>=2.2.0"]
# kafka-python 2.0.2 fails to import on Python 3.12 (vendored six.moves
# was removed from the stdlib). kafka-python-ng is the maintained fork
# and exposes the same `kafka` package name.
stream = ["kafka-python-ng>=2.2.2", "faust-streaming>=0.10.14"]
serve  = ["fastapi>=0.110.0", "uvicorn[standard]>=0.28.0"]
llm    = ["anthropic>=0.23.0"]
all    = ["medroad-v3[ml,stream,serve,llm]"]
dev    = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.urls]
Homepage   = "https://github.com/pboulanger/medroad-v3"
Repository = "https://github.com/pboulanger/medroad-v3"
Issues     = "https://github.com/pboulanger/medroad-v3/issues"

[project.scripts]
medroad = "medroad_v3.main:main"

[tool.setuptools.packages.find]
include = ["medroad_v3*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-q --strict-markers"
markers = [
    "integration: requires a live OpenEMR/Kafka stack",
]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
